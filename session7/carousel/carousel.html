<!doctype html>
<html>
  <head>
    <title>Carousel</title>
    <link rel="stylesheet" href="carousel.css" />
  </head>
  <body>
    <h1>Available Items</h1>
    <div class="slides-wrapper">
      <button id="prev">&lt;</button>
      <div class="slides">
        <div class="tracker">
          <div class="slide-wrapper" id="first">
            <div class="slide">
              <img src="imgs/1.png" />
            </div>
            <h2>First Item</h2>
          </div>
          <div class="slide-wrapper" id="second">
            <div class="slide">
              <img src="imgs/2.png" />
            </div>
            <h2>Second Item</h2>
          </div>
          <div class="slide-wrapper" id="third">
            <div class="slide">
              <img src="imgs/3.png" />
            </div>
            <h2>Third Item</h2>
        </div>
        </div>
      </div>
      <button id="next">&gt;</button>
    </div>

    <script src="carousel.js"></script>
  </body>
</html>
